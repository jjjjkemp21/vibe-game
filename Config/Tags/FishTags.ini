; Gameplay tags for the fish system (T-008) and the world context it reads (regions, habitats, weather, bait).
; Every fish tag is registered here, none in C++: a new stat, habitat, region, bait or trait is a data edit.
; A new stat also needs a row in data/tables/DT_FishStat.json. The only tag the code knows by name is Fish.Stat.Weight.
; Time of day is float hours in the data (FFishTimeWindow), not tags.

[/Script/GameplayTags.GameplayTagsList]
