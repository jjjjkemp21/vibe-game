; Gameplay tag settings. The tags themselves live in Config/Tags/*.ini (text, one file per system).
; FastReplication: tags replicate as a small index instead of their name (a fish record's six stat tags drop from about
; 30 bytes each to 1-2 bytes; T-008 replicated-size budget <= 256 bytes). Requires the same tag list on client and
; server, which holds because every tag is in these config files (same build = same tags).

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
FastReplication=True
