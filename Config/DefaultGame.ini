NoticeSeconds=4.0

[/Script/VibeGame.FishSettings]
; Level-gap rule (T-008 hook, used by T-007 fights and T-010): d = FishLevel - PlayerLevel,
; multiplier = clamp(1 + max(0,d)*OverLevelFactor - max(0,-d)*UnderLevelFactor, MinMultiplier, MaxMultiplier). Fish above your level are much harder.
LevelScaling=(OverLevelFactor=0.350000,UnderLevelFactor=0.100000,MinMultiplier=0.500000,MaxMultiplier=5.000000)

