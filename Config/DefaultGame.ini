[/Script/VibeGame.LureProgressionSettings]
; T-010 money, XP and levels; T-030 the physical cooler and selling. Rows in data/tables/DT_PlayerLevel.csv, DT_Cooler.csv, DT_FishMarket.csv; rules docs/specs/progression-rules.md, catch-handling-rules.md.
PlayerLevelTable=/Game/Data/DT_PlayerLevel.DT_PlayerLevel
CoolerTable=/Game/Data/DT_Cooler.DT_Cooler
MarketTable=/Game/Data/DT_FishMarket.DT_FishMarket
DefaultCoolerId=Starter
; FallbackCoolerSlots (only if DT_Cooler is missing) is set in C++ (LureProgressionSettings.h), the one place for it.
DefaultMarketId=Default
StartingMoney=0
; Placeholder text (money, level, XP, cooler, held fish, interact prompts) top-left until the T-011 HUD.
bShowPlaceholderText=True
; Seconds the "Level up! Level N" and "Sold N fish for X coins" notices stay on the owner's HUD.
NoticeSeconds=4.0

[/Script/VibeGame.FishSettings]
; Level-gap rule (T-008 hook, used by T-007 fights and T-010): d = FishLevel - PlayerLevel,
; multiplier = clamp(1 + max(0,d)*OverLevelFactor - max(0,-d)*UnderLevelFactor, MinMultiplier, MaxMultiplier). Fish above your level are much harder.
LevelScaling=(OverLevelFactor=0.350000,UnderLevelFactor=0.100000,MinMultiplier=0.500000,MaxMultiplier=5.000000)

[/Script/VibeGame.LureWaterSettings]
; T-027 fish anywhere + hot spots (docs/specs/fishing-water-rules.md). Every body of water can be fished; the level's water
; areas (layout "water_area" markers) decide the habitat; water outside every area uses DefaultWaterHabitat.
DefaultWaterHabitat=Habitat.Shore
; Data-gap safety net until the species batch (T-009): if no species of the water's habitat bites at this hour (bait
; ignored), bites use the first of these habitats that has one (logged once). Bonefish 05-19 + Coral Snapper 15-09 cover the day.
+GapFallbackHabitats=Habitat.Shore
+GapFallbackHabitats=Habitat.Reef
; Nothing bites in water shallower than this (cm); depth is measured down to DepthProbe (cm).
MinBiteDepth=15.0
DepthProbe=5000.0
; Migration: a level with no water area at all reads its fishing_spot markers as circle areas.
bLegacySpotsWhenNoAreas=True
LegacySpotPriority=0
; Hot spot types: data/tables/DT_HotSpot.json. A level only gets hot spots from its "hot_spots" marker (ALureHotSpotSpawner).
HotSpotTable=/Game/Data/DT_HotSpot.DT_HotSpot
HotSpotCheckInterval=1.0
; The level-start check counts as this many seconds; an area nobody is near banks its waiting time up to this long.
HotSpotPrewarmSeconds=45.0
MaxHotSpots=16
; Open-water hot spots within this of a random player (cm); every hot spot must be within HotSpotNearPlayerRadius of some player (0 = off).
OpenWaterSpawnRadius=1800.0
HotSpotNearPlayerRadius=2500.0
HotSpotSpawnTries=12
HotSpotFadeSeconds=1.5

